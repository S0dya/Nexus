info:
  name: Profile Me
  type: http
  seq: 8

http:
  method: GET
  url: "{{baseUrl}}/profile/me"
  body:
    type: json
    data: |-
      {
          "refreshToken":"{{refreshToken}}",
          "deviceId":"{{deviceId}}"
      }
  auth:
    type: bearer
    token: "{{accessToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
