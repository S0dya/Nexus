info:
  name: Logout
  type: http
  seq: 7

http:
  method: POST
  url: "{{baseUrl}}/auth/logout"
  body:
    type: json
    data: |-
      {
          "refreshToken":"{{refreshToken}}",
          "deviceId":"{{deviceId}}"
      }
  auth:
    type: bearer
    token: "{{accessToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
